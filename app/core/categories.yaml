# ---- Transfers (between your OWN accounts vs to other people) ----
#
# Important: order matters here. "Bank Transfer" catches your OWN
# top-ups to the I&M account (paybill 542542 with your account
# number, plus the specific phone-number transfers between your
# wallet and bank). "People Transfer" catches everything else
# person-to-person.

Bank Transfer:
  - personal transfer
  - family transfer
  - "542542"               # I&M Bank paybill (you topping up your own account)
  - "522522"               # KCB paybill (if topping up your own KCB)
  - "714777"               # LOOP
  - mpesa payment to 254729920461   # your own bank-linked number
  # TODO: add any other phone/paybill numbers that are YOUR accounts

People Transfer:
  - customer transfer
  - send money
  - mpesa payment to 2547   # generic phone-number payment from the bank
  # TODO: replace this generic rule (or keep + add specific people
  # above it) once you want named categories like "Family - Mum",
  # "Friend - X", etc.


# ---- Cash & misc ----

Withdrawal:
