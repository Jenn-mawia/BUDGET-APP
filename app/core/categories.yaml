# Category rules — Budget App
#
#
# How it works:
#   - Each transaction's description is lower-cased.
#   - Rules are checked in ORDER from top to bottom.
#   - The FIRST matching category wins.
#   - Anything that matches nothing becomes "Uncategorized".
#
# Therefore:
#   - Put SPECIFIC rules (Rent, Fuliza, Travel) NEAR THE TOP.
#   - Put GENERAL rules (Charges, Bank Transfer) NEAR THE BOTTOM.
#   - Otherwise a broad keyword like "charge" or "pay bill" will swallow more specific transactions before they're seen.
#
# Keywords are matched as plain substrings (no regex), e.g.
# "kplc" matches any description containing "kplc" anywhere.
# Quote keywords that are pure numbers (like a paybill number) so YAML reads them as strings.
# 


# ---- Loans & overdrafts (must be first — these phrases overlap with everything else) ----

